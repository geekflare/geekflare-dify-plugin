identity:
  author: geekflare
  name: geekflare
  label:
    en_US: Geekflare
  description:
    en_US: Web search with full Google SERP results, page scraping, metadata, brand data, screenshots, URL-to-PDF, and website diagnostics.
  icon: icon.png
  tags:
    - search
    - utilities
credentials_for_provider:
  geekflare_api_key:
    type: secret-input
    required: true
    label:
      en_US: Geekflare API key
    placeholder:
      en_US: Enter your Geekflare API key
    help:
      en_US: Get an API key from the Geekflare dashboard (a free tier is available).
    url: https://dash.geekflare.com
tools:
  - tools/geekflare_search.yaml
  - tools/geekflare_scrape.yaml
  - tools/geekflare_metadata.yaml
  - tools/geekflare_brand.yaml
  - tools/geekflare_screenshot.yaml
  - tools/geekflare_url_to_pdf.yaml
  - tools/geekflare_site_check.yaml
extra:
  python:
    source: provider/geekflare.py
